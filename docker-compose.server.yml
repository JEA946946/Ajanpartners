# Produktion: læg denne fil oven på docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# API'et lytter kun på localhost; en reverse proxy (nginx/Caddy) foran står for
# TLS og serverer frontend-builden (frontend/dist). Hemmeligheder i .env (ikke i git).
services:
  django:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.server
    ports: !override
      - "127.0.0.1:${API_PORT:-8001}:8001"
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.server

volumes:
  static:
