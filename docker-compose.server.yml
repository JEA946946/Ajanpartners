services:
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dmc_bookkeeping_django
    container_name: dmc_bookkeeping_django
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.server
      - DB_HOST=dmc-cmr-db
      - DJANGO_ALLOWED_HOSTS=bookkeeping.vmmorocco.com
      - CORS_ALLOWED_ORIGINS=https://bookkeeping.vmmorocco.com
      - CMR_API_BASE=http://dmc_cmr_django_local_django:8000/api/v1
    # Secrets (DJANGO_SECRET_KEY, DB_PASSWORD, CMR_API_TOKEN, BOARD_API_TOKEN,
    # GOOGLE_PLACES_API_KEY) live in .env.server on the host — never in git.
    env_file:
      - .env.server
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_accounts &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 2 --timeout 120 --access-logfile - --error-logfile - --access-logformat '%({x-forwarded-for}i)s %(t)s %(m)s %(U)s%(q)s %(s)s %(b)s %(D)sus'"
    # Uploaded pièces justificatives must survive redeploys and be kept 10 years
    # (Loi 9-88 art. 22); infra/backup.sh copies them with the database every night.
    volumes:
      - /opt/dmc-bookkeeping/media:/app/media
    restart: unless-stopped
    networks:
      - dmc-cmr-network

networks:
  dmc-cmr-network:
    external: true
    name: dmc-cmr_dmc-cmr-network
